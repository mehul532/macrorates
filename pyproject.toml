[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macrorates"
version = "0.1.0"
description = "Macroeconomic Shocks, Dynamic Yield Curves, and Systematic Treasury Relative Value"
readme = "README.md"
authors = [
    { name = "Mehul Garg", email = "mgarg29@wisc.edu" }
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyarrow>=12.0.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "statsmodels>=0.14.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
